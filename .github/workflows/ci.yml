name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # swift-format's default rules drift between toolchain minors, so an
      # unpinned Xcode lets lint pass locally and fail here.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Lint
        run: swift format lint --strict --recursive --parallel Sources Tests Package.swift

  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Report toolchain
        run: swift --version

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-debug-${{ github.event.repository.name }}-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-debug-${{ github.event.repository.name }}-${{ runner.os }}-
            spm-${{ github.event.repository.name }}-${{ runner.os }}-

      - name: Test
        run: swift test --parallel

  raycast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raycast
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raycast/package-lock.json

      - name: Install
        run: npm ci

      # `ray build` needs the Raycast app and a signed-in account, so CI checks the
      # extension the way it can: types, lint, and the CLI-contract tests.
      - name: Check
        run: |
          npx tsc --noEmit
          npx eslint .
          npx prettier --check "src/**/*.{ts,tsx}" "test/**/*.ts"
          npx vitest run

  performance:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-release-${{ github.event.repository.name }}-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-release-${{ github.event.repository.name }}-${{ runner.os }}-
            spm-${{ github.event.repository.name }}-${{ runner.os }}-

      # The perf gate only means something against optimized code, and its timing
      # assertions need the box to itself, so it runs serial in its own job.
      # The widened budget absorbs virtualized-runner noise (observed p95 up to
      # 12ms against the 10ms user-hardware default) while still failing loudly
      # on a real regression.
      - name: Performance (release)
        run: swift test -c release --filter SearchPerformanceTests
        env:
          CAPD_SEARCH_PERF_BUDGET_MS: "20"
